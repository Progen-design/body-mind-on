# AI Scheduler — RUČNÍ ZÁCHRANA. Pravidelný běh dělá Vercel cron.
#
# ===========================================================================
# PROČ TADY UŽ NENÍ `schedule`
# ===========================================================================
# Tenhle workflow vznikl jako náhrada za Vercel Hobby plan, který uměl cron
# jen 1× denně. Projekt je dneska na Pro a sub-denní crony prokazatelně jedou
# (`translate-recipes` po 5 minutách).
#
# 21. 8. 2026 se `schedule` zakomentoval s odůvodněním, že „v repu nejsou
# secrets APP_URL a CRON_SECRET". To nebyla pravda — oba jsou nastavené od
# 11. 3. 2026 a běhy před vypnutím končily success za 9–17 s. Scheduler tím
# přestal běžet na čtyři dny, aniž by to kdokoli poznal.
#
# Přesunuto do `vercel.json` → `crons` (28. 8. 2026), protože:
#   * je to jediné místo, kde jsou naplánované všechny ostatní úlohy,
#   * odpadá duplikace CRON_SECRET mezi Vercelem a GitHubem — právě ta tenhle
#     výpadek způsobila,
#   * `api/ai/run-scheduler.js` už `maxDuration: 300` má, chyběl jen rozvrh.
#
# Soubor zůstává kvůli `workflow_dispatch`: ruční spuštění z Actions UI je
# záchrana pro případ, kdy je Vercel cron mimo provoz nebo je potřeba frontu
# protlačit hned. Rozvrh sem NEVRACEJ — dvě místa, která plánují totéž, se
# zase rozejdou.

name: AI Scheduler (ruční spuštění)

on:
  workflow_dispatch:

jobs:
  run-scheduler:
    name: Trigger AI run-scheduler
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Call /api/ai/run-scheduler
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${APP_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "::error::Missing secrets: set APP_URL and CRON_SECRET in repository Secrets (Settings → Secrets and variables → Actions). Exit code 3 from curl usually means APP_URL was empty (malformed URL)."
            exit 1
          fi
          APP_URL="${APP_URL%/}"
          set +e
          STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 300 \
            "${APP_URL}/api/ai/run-scheduler")
          CURL_EXIT=$?
          set -e
          if [ $CURL_EXIT -ne 0 ]; then
            echo "::error::curl failed (exit $CURL_EXIT). Check APP_URL (e.g. https://app.bodyandmindon.cz) and network."
            cat /tmp/response.json 2>/dev/null || true
            exit 1
          fi
          echo "HTTP status: $STATUS"
          cat /tmp/response.json | python3 -m json.tool 2>/dev/null || cat /tmp/response.json
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "::error::Scheduler returned HTTP $STATUS"
            exit 1
          fi
