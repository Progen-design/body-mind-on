name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # OpenAI ma peerOptional zod@^3, projekt ma zod@4 — stejny duvod jako u Vercel buildu.
      - run: npm ci --legacy-peer-deps
      - run: npm run test:unit
      - run: npm run test:health
      # Testy SPA vrstvy (src/) driv v CI nebezely vubec.
      - run: npm run test:src
      # ESLint driv kontroloval jediny soubor (lib/mail.js).
      - run: npm run lint:ci
      # PROMPT_UKLID.md (2026-09-17) Blok 3 — stejne kroky jako npm run check,
      # aby se CI a lokalni gate nerozeply znovu.
      - run: npm run lint:copy
      # Knip hlasi (25 nepouzitych souboru + stovky exportu, predchazejici
      # dluh mimo rozsah tohohle uklidu) ale neblokuje — --no-exit-code.
      # Ostry, blokujici pruchod je `npm run lint:dead` bez flagu, rucne.
      - run: npm run lint:dead -- --no-exit-code
      # PROMPT_NAKLADY_AI.md (2026-09-18) — jedina cesta k modelu OpenAI je
      # volejModel() z lib/openai.js; bez tyhle brany by se ucetnictvi zase
      # dalo tise obejit vlastnim klientem.
      - run: npm run verify:openai-uctovani
      # Skupina A z docs/BRANY_KVALITY.md — bez site/service_role/prohlizece,
      # dnes zelene; nova polozka pribyva jen po zapisu do te tabulky.
      - run: npm run verify:ci-gates
      # BUILD A TYPECHECK ZPATKY (17. 9. 2026). Blok 3 sjednotil `check` s CI,
      # ale pri tom z `check` vypadl `npm run build`, ktery tam predtim byl,
      # a typecheck v CI nikdy nebezel. Chyba v typech nebo v buildu by tak
      # prosla az na Vercel — tedy po mergi do main, kde uz je pozde.
      - run: npm run typecheck
      - run: npm run build
