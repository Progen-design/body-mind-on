name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # OpenAI ma peerOptional zod@^3, projekt ma zod@4 — stejny duvod jako u Vercel buildu.
      - run: npm ci --legacy-peer-deps
      - run: npm run test:unit
      - run: npm run test:health
      # Testy SPA vrstvy (src/) driv v CI nebezely vubec.
      - run: npm run test:src
